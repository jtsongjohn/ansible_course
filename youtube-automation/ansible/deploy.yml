---
# 유튜브 정치 콘텐츠 자동화 파이프라인 배포 플레이북
#
# 사용법:
#   cp inventory.ini.example inventory.ini   # 서버 정보 채우기
#   ansible-vault create secrets.yml         # anthropic_api_key 등 비밀값 작성 (아래 예시 참고)
#   ansible-playbook -i inventory.ini deploy.yml --ask-vault-pass
#
# secrets.yml 예시:
#   anthropic_api_key: "sk-ant-..."
#   assembly_open_api_key: ""   # 선택
#
- name: Deploy YouTube politics automation pipeline
  hosts: youtube_pipeline
  become: true
  vars:
    app_dir: /opt/youtube-automation
    app_user: ytauto
    repo_local_path: "{{ playbook_dir }}/.."   # 로컬에서 rsync로 배포
    tts_hour: "7"     # 매일 이 시각(서버 로컬 타임존)에 파이프라인 실행
    tts_minute: "30"
    anthropic_api_key: ""      # secrets.yml(ansible-vault)로 덮어쓰세요
    assembly_open_api_key: ""

  vars_files:
    - "{{ playbook_dir }}/secrets.yml"

  roles:
    - youtube_pipeline
