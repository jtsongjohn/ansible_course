---
- name: Install system packages
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-pip
      - ffmpeg
      - fonts-nanum
      - rsync
    state: present
    update_cache: true
  # ImageMagick은 불필요: moviepy 2.x의 TextClip은 Pillow로 직접 렌더링한다.
  # (한글 렌더링에는 fonts-nanum 이 제공하는 실제 폰트 파일이 필요하다.)

- name: Create dedicated service user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: true

- name: Ensure app directory exists
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0750"

- name: Sync application code to server
  ansible.posix.synchronize:
    src: "{{ repo_local_path }}/"
    dest: "{{ app_dir }}/"
    delete: false
    rsync_opts:
      - "--exclude=output"
      - "--exclude=.git"
      - "--exclude=venv"
      - "--exclude=ansible/secrets.yml"

- name: Fix ownership after sync
  ansible.builtin.file:
    path: "{{ app_dir }}"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    recurse: true

- name: Create Python virtualenv and install dependencies
  ansible.builtin.pip:
    requirements: "{{ app_dir }}/requirements.txt"
    virtualenv: "{{ app_dir }}/venv"
    virtualenv_command: python3 -m venv

- name: Deploy .env file with secrets
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0600"

- name: Ensure output directory exists
  ansible.builtin.file:
    path: "{{ app_dir }}/output"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0750"

- name: Deploy systemd service (oneshot pipeline run) per channel
  ansible.builtin.template:
    src: pipeline.service.j2
    dest: "/etc/systemd/system/youtube-pipeline-{{ item.name }}.service"
    mode: "0644"
  loop: "{{ channels }}"
  loop_control:
    label: "{{ item.name }}"
  notify: reload systemd

- name: Deploy systemd timer (daily schedule) per channel
  ansible.builtin.template:
    src: pipeline.timer.j2
    dest: "/etc/systemd/system/youtube-pipeline-{{ item.name }}.timer"
    mode: "0644"
  loop: "{{ channels }}"
  loop_control:
    label: "{{ item.name }}"
  notify: reload systemd

- name: Flush handlers so systemd sees new unit files
  ansible.builtin.meta: flush_handlers

- name: Enable and start each channel's timer
  ansible.builtin.systemd:
    name: "youtube-pipeline-{{ item.name }}.timer"
    enabled: true
    state: started
  loop: "{{ channels }}"
  loop_control:
    label: "{{ item.name }}"
