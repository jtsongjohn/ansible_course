# ============================================================
# YouTube 정치 콘텐츠 자동화 파이프라인 설정
# ============================================================

# --- 이슈 소스: RSS 피드 (공개된 뉴스 제목/요약만 수집, 본문 전체 저장 X) ---
rss_feeds:
  - name: "연합뉴스 정치"
    url: "https://www.yna.co.kr/rss/politics.xml"
  - name: "한겨레 정치"
    url: "https://www.hani.co.kr/rss/politics/"
  - name: "국회방송(NATV) 보도"
    url: "https://www.natv.go.kr/rss/news.xml"   # 접속 불가 시 국회 공식 채널 URL로 교체
  - name: "네이버 뉴스 정치(검색 RSS)"
    url: "https://news.google.com/rss/search?q=%EA%B5%AD%ED%9A%8C+%EC%A0%95%EC%B9%98&hl=ko&gl=KR&ceid=KR:ko"

# --- 이슈 선정 파라미터 ---
issue_selection:
  lookback_hours: 24          # 최근 N시간 내 기사만 집계
  top_n_keywords: 10          # 상위 키워드 몇 개까지 뽑을지
  top_n_issues: 3             # 최종 이슈(=콘텐츠 후보) 몇 개 뽑을지
  min_mentions: 2             # 최소 언급 횟수
  stopwords_file: "config/stopwords_ko.txt"

  # 평소 트래킹하는 이슈/키워드를 여기 적어두면, 언급 횟수가 같거나 적어도
  # 우선순위를 높여 선정합니다. (예: 특정 상임위, 법안명, 정치인 이름 등)
  # 부분 일치도 허용합니다 (예: "탄핵" 하나만 넣어도 "탄핵소추안" 기사에 매칭).
  watch_keywords: []
  watch_keyword_boost: 3      # watch_keywords에 매칭되면 언급 횟수에 곱해줄 가중치

# --- 소스 사용 방식 ---
content_mode:
  narration_and_captions: true

  # true로 바꾸면 finalize.py가 script.json의 source_clip_path(사용자가 직접
  # 준비한 로컬 클립 파일)를 영상 앞부분에 실제로 이어붙입니다. 저작권 침해
  # 리스크가 매우 높은 기능이므로 기본값은 꺼져 있고, 클립 확보/사용 범위는
  # 전적으로 사용자 책임입니다. 이 파이프라인은 클립을 자동으로 수집·다운로드
  # 하지 않습니다. README.md의 "저작권/법적 리스크" 섹션을 반드시 읽어보세요.
  reupload_raw_clips: false

  # true로 바꾸면 main.py가 마무리(cta) 없이 hook+body만으로 초안을 만들고,
  # script.json에 closing_remark(직접 쓰는 "한마디")/source_clip_path 빈
  # 필드를 추가합니다. 채워넣은 뒤 finalize.py로 최종본을 만듭니다.
  # (3번 "멀티 채널 운영하기" 섹션 및 "한마디" 워크플로 참고)
  manual_closing_remark: false

# --- 대본 생성 (Claude API 사용) ---
script_generation:
  model: "claude-sonnet-5"
  target_seconds: 50          # 쇼츠 목표 길이(초)
  max_words: 160
  tone: "객관적 사실 전달 + 간결한 해설, 특정 정당·정치인에 대한 편향적 단정 표현 지양"
  require_source_citation: true

  # 대본 생성 후 별도 Claude 호출로 "근거 없는 주장/인신공격 표현이 있는가"를
  # 재검증합니다. API 호출이 1번 더 늘어나므로 기본값은 꺼져 있습니다.
  # 사람의 최종 검수를 대체하지 않습니다 — 검수 시 참고할 경고 표시일 뿐입니다.
  fact_check_enabled: false

# --- TTS(음성 합성) ---
tts:
  engine: "edge-tts"          # 무료, 별도 API 키 불필요
  voice: "ko-KR-InJoonNeural" # 다른 옵션: ko-KR-SunHiNeural 등
  rate: "+0%"

# --- 영상 조립 ---
video:
  resolution: [1080, 1920]    # Shorts 세로 비율
  fps: 30
  background_mode: "gradient" # gradient | solid | image | broll(직접 소유한 브롤만 권장)
  background_color_from: "#0b1e3d"
  background_color_to: "#1c3f6e"
  font: "NanumGothicBold"
  caption_max_chars_per_line: 18

output_dir: "output"
