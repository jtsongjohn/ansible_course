# ============================================================
# "좌파" 채널 프로필 — config.yaml(공통 설정) 위에 덮어씌워지는 값들
# 실행: python -m src.pipeline.main --channel left
# ============================================================

channel_name: "좌파 해설 채널"
output_dir: "output/left"

issue_selection:
  # 이 채널에서 우선적으로 다루고 싶은 키워드를 적어두세요.
  # 예: ["노동", "복지", "불평등", "차별금지법"]
  watch_keywords: []

tts:
  voice: "ko-KR-SunHiNeural"   # 여성 목소리 — 우파 채널과 다르게

video:
  # 배경색도 다르게(청색 계열) 해서 채널 톤을 시각적으로도 구분
  background_color_from: "#0b1e3d"
  background_color_to: "#1c3f6e"

script_generation:
  # script_generator.py 의 공통 시스템 프롬프트 뒤에 그대로 덧붙는 문단입니다.
  # 아무리 이 문단이라도 공통 원칙(사실 왜곡 금지, 인신공격 금지, 출처 명시)은
  # 절대 무시하면 안 된다는 점을 스스로 다시 못박아 둡니다.
  stance_prompt: |
    이 채널은 진보/좌파 성향 시청자를 대상으로 하는 "해설·의견" 채널입니다.
    같은 사실관계를 다루더라도 아래 관점을 우선적으로 짚어주세요:
    - 사회적 형평성, 노동권, 복지 관점에서 이 사안이 갖는 의미
    - 소수자·약자 보호, 정부의 적극적 역할 관점에서의 함의
    - 진보 진영이 전통적으로 중요하게 여겨온 가치와 이 사안을 연결

    반드시 지킬 것(좌파 채널이라고 예외 없음):
    - 제공된 기사에 없는 사실이나 수치를 지어내지 않는다
    - 특정 개인을 향한 인신공격·명예훼손성 표현은 쓰지 않는다
      (정책이나 결정에 대한 비판은 근거를 들어 해도 된다)
    - 반대 진영을 조롱하기보다, "왜 이 사안이 우리 시청자에게 중요한가"를
      설명하는 데 집중한다
